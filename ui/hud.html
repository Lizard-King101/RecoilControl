<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Recoil HUD</title><link rel="stylesheet" href="hud.css">
</head>
<body>
  <div class="hud-shell" id="hud-shell">
    <div class="hud-main">
      <div class="hud-top"><span class="hud-abbr" id="hud-abbr">AK</span><span class="hud-title"><span class="hud-name" id="hud-weapon">Assault Rifle</span><span class="hud-game" id="hud-game">RUST</span></span><span class="state" id="hud-chip"><i id="hud-dot"></i><span id="hud-state">STANDBY</span></span><button id="open-settings" title="Open configuration (Ctrl+Shift+H)" aria-label="Open configuration"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 1v2M7 11v2M1 7h2M11 7h2M2.8 2.8l1.4 1.4M9.8 9.8l1.4 1.4M2.8 11.2l1.4-1.4M9.8 4.2l1.4-1.4" stroke="currentColor" stroke-width="1.4"/></svg></button></div>
      <div class="hud-bottom"><span class="stance-bar" id="hud-stances" aria-hidden="true"></span><span id="hud-profile">Default</span><span class="hud-meta"><span id="hud-dpi">800 DPI</span><span class="shortcut">ESC OFF</span></span></div>
    </div>
    <div id="hud-controls"><button id="previous-weapon" aria-label="Previous configured weapon">‹</button><select id="hud-select" aria-label="Select weapon"></select><button id="next-weapon" aria-label="Next configured weapon">›</button><button id="hud-toggle" aria-label="Toggle compensation">Arm</button></div>
    <div id="hud-tuning" hidden></div>
  </div>
  <script src="hud.js"></script>
</body>
</html>
