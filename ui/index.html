<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Recoil Control</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="titlebar"><span class="brand-word">RECOIL<span>/</span>CONTROL</span></div>
  <div class="app-shell">
    <aside class="game-sidebar" aria-label="Game collections">
      <div class="sidebar-heading"><span class="kicker">Your games</span><span id="game-count" class="nav-count"></span></div>
      <nav id="game-list" aria-label="Select a game"></nav>
      <button id="new-game" class="button subtle add-game" data-action="new-game"><span aria-hidden="true">+</span> Add game</button>
      <p class="sidebar-hint">Each game has its own loadout, controls, and stances.</p>
    </aside>
    <div class="app-workspace">
      <header class="appbar">
        <nav class="main-nav" aria-label="Game workspace">
          <button class="nav-item active" data-view="arsenal">Loadout <span class="nav-count" id="weapon-count">6</span></button>
          <button class="nav-item" data-view="controls">Controls</button>
          <button class="nav-item" data-view="community">Community</button>
        </nav>
        <div class="appbar-status">
          <button class="link-status" data-action="retry" title="Reconnect input"><span id="connection-dot" class="dot"></span><span><strong id="connection-label">Connecting input…</strong><small id="connection-detail">Checking your devices</small></span></button>
          <div class="settings-menu">
            <button id="settings-button" class="nav-item" data-action="settings-menu" aria-expanded="false" aria-controls="settings-options">Settings <span aria-hidden="true">⌄</span></button>
            <div id="settings-options" class="settings-options" hidden>
              <button data-view="input">Mouse &amp; sensitivity<small>Input and calibration</small></button>
              <button data-view="board">Board &amp; Bluetooth<small>Connection and firmware</small></button>
              <button data-view="hud">HUD<small>Overlay and appearance</small></button>
            </div>
          </div>
          <button id="enable-toggle" class="arm-toggle" role="switch" aria-checked="false" aria-label="Enable recoil control" data-action="toggle"><span id="engine-label">Standby</span><kbd id="toggle-key">F7</kbd></button>
        </div>
      </header>
      <div id="notice" role="status" class="notice" hidden></div>
      <main id="content"></main>
    </div>
  </div>
  <footer class="statusbar"><span><span class="dot orange"></span><span id="footer-weapon">Assault Rifle</span></span><div id="footer-keys"></div><span id="footer-setup">800 DPI</span></footer>
  <div id="toast" role="status" class="toast" hidden></div>
  <dialog id="dialog"></dialog>
  <script src="pattern-tools.js"></script><script src="pattern-editor.js"></script><script src="controls.js"></script><script src="attachments.js"></script><script src="community.js"></script><script src="app.js"></script>
</body>
</html>
