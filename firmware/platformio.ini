[platformio]
default_envs = xiao_esp32c3

[env:xiao_esp32c3]
platform = espressif32@7.0.1
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
lib_deps =
    h2zero/NimBLE-Arduino@2.5.2
    adafruit/Adafruit NeoPixel@1.15.5
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
